<div class="min-h-dvh w-full flex items-center justify-center font-sans p-4 sm:p-8 relative overflow-hidden" style="background-image: url('/fondo_auth.png'); background-size: cover; background-position: center;">

  <div class="relative z-10 w-full max-w-md bg-crema rounded shadow-lg border border-gris-300 p-6 sm:p-10">

    <!-- Logo -->
    <div class="flex items-center gap-3 pb-6">
      <div class="w-10 h-10 rounded-full bg-marino-700 text-white font-display font-semibold text-base flex items-center justify-center relative overflow-hidden shrink-0">
        <div class="absolute inset-0 opacity-20"
             style="background-image: repeating-linear-gradient(45deg, #fff 0, #fff 1px, transparent 1px, transparent 6px);">
        </div>
        <span class="relative">BP</span>
      </div>
      <div class="flex flex-col leading-tight min-w-0">
        <span class="text-[12px] sm:text-[13px] font-semibold uppercase tracking-wider text-marino-900 truncate">Biblioteca de Prácticas</span>
        <span class="text-[11px] sm:text-[12px] text-marino-400">Repositorio académico</span>
      </div>
    </div>

    <div class="mb-6">
      <h1 class="font-display text-2xl sm:text-3xl text-marino-900 font-semibold tracking-tight">
        Verifica tu correo
      </h1>
      <p class="text-sm text-marino-400 mt-2">
        Enviamos un código de 6 dígitos a
        <span class="font-semibold text-marino-700 break-all">{{ email }}</span>.
        Vence en 10 minutos.
      </p>
    </div>

    <div *ngIf="aviso" class="bg-ambar-200 text-ambar-700 text-sm rounded px-3 py-2.5 mb-4">
      {{ aviso }}
    </div>

    <div *ngIf="error" class="bg-red-400 text-white text-sm rounded px-3 py-2.5 mb-4">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gris-500">Código de verificación</label>
        <input
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          [(ngModel)]="codigo"
          (ngModelChange)="soloNumeros()"
          name="codigo"
          placeholder="000000"
          class="w-full border border-gris-300 rounded px-3 py-3 text-center text-2xl tracking-[0.5em] font-mono bg-white focus:outline-none focus:ring-2 focus:ring-ambar-500 focus:border-transparent"
        />
      </div>

      <button
        type="submit"
        [disabled]="cargando || codigo.length !== 6"
        class="cursor-pointer w-full bg-marino-700 text-white font-medium py-3 sm:py-2.5 rounded-lg hover:bg-marino-600 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ cargando ? 'Verificando...' : 'Verificar y entrar' }}
      </button>
    </form>

    <div class="text-center mt-6 text-xs text-marino-400">
      ¿No te llegó el código?
      <button
        type="button"
        (click)="reenviar()"
        [disabled]="segundosRestantes > 0 || reenviando"
        class="cursor-pointer font-medium text-ambar-600 hover:text-ambar-700 disabled:text-gris-400 disabled:cursor-not-allowed"
      >
        {{ segundosRestantes > 0 ? 'Reenviar en ' + segundosRestantes + ' s' : (reenviando ? 'Enviando...' : 'Reenviar código') }}
      </button>
      <p class="mt-1">Revisa también tu carpeta de spam.</p>
    </div>

    <a routerLink="/registro" class="block text-center text-xs text-marino-400 hover:text-marino-700 transition-colors mt-4">
      Usar otro correo
    </a>

    <div class="pt-6 mt-6 border-t border-gris-200 text-[12px] text-gris-400 text-center">
      © {{ anioActual }} Biblioteca de Prácticas
    </div>
  </div>
</div>
